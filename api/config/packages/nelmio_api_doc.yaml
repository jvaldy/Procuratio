nelmio_api_doc:
    documentation:
        info:
            title: Procuratio API
            description: OpenAPI specification for Procuratio backend.
            version: 1.0.0
        components:
            securitySchemes:
                bearerAuth:
                    type: http
                    scheme: bearer
                    bearerFormat: JWT
        security:
            - bearerAuth: []
    areas:
        path_patterns:
            - ^/api(?!/doc$)
